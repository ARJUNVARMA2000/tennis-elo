name: refresh

# Three triggers on one workflow:
#   * 06:00 UTC daily -> FULL: download everything, retrain both tours, rebuild all JSON.
#   * hourly at :17   -> QUICK: re-pull ESPN live results and regenerate JSON from the
#     saved model (no retrain; warm-cache tour exports run in parallel). The data cache carries
#     and the trained predictor.pkl + accuracy.json between runs. (:17 dodges the
#     top-of-hour Actions scheduling congestion; the 06:00 hour belongs to the full run.)
#   * push to master  -> QUICK: redeploy the site immediately with the cached data/model.
on:
  push:
    branches: [master]
    paths-ignore:
      - "tasks/**"
      - "README.md"
      - "tennis_model/README.md"
  schedule:
    - cron: "0 6 * * *"            # daily FULL retrain
    - cron: "17 0-5,7-23 * * *"    # hourly QUICK refresh (skips the 06:00 full slot)
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [auto, full, quick]
        default: auto

permissions:
  contents: write      # commit the append-only forecast log back to the repo
  issues: write        # open/comment/close the data-health issue on a failed health check

# The public site URL, in one place: the build (metadataBase -> og:image), the
# deployment environment link, and the health issue's status-page link all derive from
# it. Moving hosts again means changing this line, not hunting hardcoded URLs.
env:
  SITE_URL: https://deuce-forecast.web.app
  PYTHONUNBUFFERED: "1"

# Serialize deploys but NEVER cancel one mid-flight: a scheduled refresh or a
# concurrent push used to cancel the in-progress deploy carrying a change (cancel-in-progress:
# true), so the change silently never shipped and the run had to be re-dispatched by hand.
# false = the in-progress run finishes; GitHub queues only the latest superseding run and
# skips the intermediate ones.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/test.yml

  refresh:
    needs: tests
    if: ${{ always() && (github.event_name != 'push' || needs.tests.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      pipeline_health_handled: ${{ steps.reportpipeline.outputs.handled }}
      pipeline_health_state: ${{ steps.reportpipeline.outputs.state }}
      selected_mode: ${{ steps.mode.outputs.mode }}
      selected_scope: ${{ steps.scope.outputs.scope }}
    # Backstop. GitHub's default job timeout is 6 HOURS, and the deploy concurrency group
    # serialises runs — so one wedged step freezes every subsequent refresh behind it. On
    # 2026-07-27 run 30227056240 sat 4h in the hourly quick refresh (unbounded Kalshi
    # retries) and the site's tournament board stayed on the previous evening's data
    # through a Monday morning when a dozen events were starting. A full retrain is ~30
    # min, so 75 leaves ample headroom while capping the blast radius at one cycle.
    timeout-minutes: 75
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          # Push classification compares the complete pushed range, which can contain
          # more than one commit. A shallow parent guess silently misclassifies that case.
          fetch-depth: 0

      - name: Decide push scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: bash .github/scripts/decide-push-scope.sh

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tennis_model/requirements.txt
      - name: Install Python deps
        id: install_python
        run: pip install -r tennis_model/requirements.txt

      # Carries data/raw (historical archive) + data/output (predictor.pkl, accuracy.json,
      # JSON) across runs so quick runs have a model to refresh from. A new cache is saved
      # each run (unique key) and the most recent is restored (restore-keys prefix).
      - name: Restore data cache
        id: restore_data
        uses: actions/cache/restore@v6
        with:
          path: tennis_model/data
          key: tennis-data-${{ github.run_id }}
          restore-keys: tennis-data-

      # If the cache was evicted, bootstrap the immutable archive from the release
      # snapshot instead of hammering (increasingly disappearing) upstreams.
      - name: Bootstrap from release snapshot (cache miss only)
        id: bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the WTA stats backfill (2024+) only exists in the snapshot — a cache that
          # predates it must also trigger the restore
          if [ ! -f tennis_model/data/raw/atp/historical/2020.csv ] \
             || [ ! -f tennis_model/data/raw/wta/stats/2024.csv ] \
             || [ ! -d tennis_model/data/raw/atp/live ] \
             || [ ! -d tennis_model/data/raw/wta/live ]; then
            echo "cache empty/incomplete -> restoring from release asset"
            gh release download data-archive --pattern 'raw-archive.tar.gz' -O /tmp/raw-archive.tar.gz \
              && tar -xzf /tmp/raw-archive.tar.gz -C tennis_model/data \
              || echo "::warning::no release snapshot available yet"
          fi

      - name: Decide mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: bash .github/scripts/decide-mode.sh

      # Downloads and the retrain are SEPARATE steps on purpose. They used to be one
      # `run:` block, and because a `run:` block is `bash -e`, a non-zero `--strict` exit
      # aborted it before the pipeline line — so 2026-07-19..24, when the fresh mirror
      # moved to LFS, the ratings walk simply never happened for five days. A download
      # that fails leaves the previous good file on disk (download_year validates and
      # never clobbers), and other sources (live ESPN results) may well have succeeded,
      # so walking ratings on what we have is strictly better than not walking at all.
      # The failure is not swallowed: it reds the run in a trailing step, after the
      # deploy, exactly like the forecast-log push does.
      - name: Download sources (full)
        id: download
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        working-directory: tennis_model
        env:
          PYTHONPATH: src
        run: |
          python -m tennis_model.data.download --kind all --strict
          python -m tennis_model.data.odds --tour all || true

      - name: Full retrain (re-walk ratings + refit combiner, both tours)
        id: retrain
        if: steps.mode.outputs.mode == 'full'
        working-directory: tennis_model
        env:
          PYTHONPATH: src
        run: |
          # Claim today's retrain BEFORE running it, and carry that in the data cache (which
          # now saves on red runs). decide-mode.sh reads it so the day's slot is used exactly
          # once however GitHub jitters delivery — and a pipeline that crashes cannot retry
          # every hour for the rest of the day. A retrain that stays broken is caught by the
          # model-age watchdog, not by hammering it.
          mkdir -p data/output
          date -u +%F > data/output/.last_full_run
          python -m tennis_model.pipeline --tour all --backtest

      - name: Quick refresh (live results + regenerate from saved model)
        id: quick
        if: steps.mode.outputs.mode == 'quick' && steps.scope.outputs.scope != 'web'
        working-directory: tennis_model
        env:
          PYTHONPATH: src
        run: python -m tennis_model.pipeline --tour all --quick

      # Pre-deploy integrity gate (BOTH modes). Blocks the deploy on any internally-
      # inconsistent produced JSON — impossible reach odds, aliveCount>drawSize, a live event
      # already naming a champion, a non-standard-size "real" draw, placeholder-name leaks,
      # missing/corrupt required JSON. Source-freshness problems are NOT gated here (those
      # still deploy best-effort and are reported by the post-deploy sentinel). On failure the
      # job stops before build/deploy, so the last good deploy stays live rather than shipping
      # a wrong one. This is why quick runs (live-draw pairings) are covered too, not just full.
      - name: Pre-deploy integrity gate
        id: gate
        working-directory: tennis_model
        env:
          PYTHONPATH: src
        run: python -m tennis_model.data.health --gate --gate-report "$RUNNER_TEMP/predeploy-gate.json"

      # Publication is one parent-owned release boundary after the semantic gate. Data
      # runs accept the sealed ATP+WTA candidate and mirror every byte named by its manifest;
      # web-only pushes may mirror only a previously gate-accepted cached release. Round 4A
      # is a shadow rollout: invalid/missing lineage falls back to the same two-tour JSON
      # mirror only after removing stale public manifest metadata. A failed fallback is fatal.
      - name: Publish validated release data
        id: mirror
        working-directory: tennis_model
        env:
          PYTHONPATH: src
        run: |
          if [ "${{ steps.scope.outputs.scope }}" = "web" ]; then
            python -m tennis_model.artifact_lineage publish --scope web
          else
            python -m tennis_model.artifact_lineage publish --scope data \
              --semantic-gate-passed --validator predeploy-integrity-gate-v1
          fi

      # Durably persist the append-only forecast log (the data cache is evictable, so
      # commit it back). Once daily on the full run keeps history to one commit/day; the
      # cache carries the hourly quick-run appends in between. continue-on-error: deploy
      # and the health sentinel must still run on a push failure — the trailing
      # "Fail if forecast-log push failed" step reds the run AFTER them, so a persistent
      # failure alerts (red run + owner email) instead of warning into the void. The
      # rebase-retry loop tolerates concurrent pushers racing this commit. The bot's own
      # push can't re-trigger this workflow (GITHUB_TOKEN events never spawn new runs).
      - name: Persist forecast log
        id: persist
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        working-directory: tennis_model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast_log data/kalshi_ledger 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no forecast-log changes to commit"
            exit 0
          fi
          git commit -m "chore(eval-logs): daily forecast log + kalshi ledger update"
          for i in 1 2 3; do
            git push && exit 0
            echo "push attempt $i failed — rebasing onto latest ${GITHUB_REF_NAME}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((10 * i))
          done
          git push && exit 0
          echo "::error::forecast-log push failed after 4 attempts — eval history exists only in the evictable cache"
          exit 1

      # Health sentinel WRITE pass, before the site build: reads the finalized pipeline
      # outputs (nothing below changes them), always exits 0, writes health.json and
      # mirrors it to web/public/data/ so THIS deploy ships its own current report — the
      # (hidden) /health page renders it. Runs on EVERY mode (a source that dies right
      # after the daily full run used to feed ~23 stale hourly deploys before the next
      # check noticed). The ALERTING on this report stays post-deploy ("Report data
      # health", last) so it can never cost a deploy.
      - name: Data health check
        id: health
        working-directory: tennis_model
        env:
          PYTHONPATH: src
        run: python -m tennis_model.data.health

      - name: Set up Node
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Restore Next build cache
        id: restore_next
        uses: actions/cache@v6
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.ts', 'web/**/*.tsx', 'web/**/*.css', 'web/**/*.mjs') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-
      # No NEXT_PUBLIC_BASE_PATH: Firebase serves the site at the domain ROOT, so the
      # basePath stays unset (the plumbing in next.config.ts defaults to "" and is kept
      # for portability). NEXT_PUBLIC_SITE_URL feeds metadataBase -> absolute og:image.
      - name: Build static site
        id: build
        working-directory: web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
        run: |
          npm ci
          npm run build

      # Deploys web/out per the repo-root firebase.json. channelId: live = the production
      # channel (omitting it would create a throwaway preview channel instead).
      # firebase.json's cache headers are load-bearing, not tuning: Firebase defaults to a
      # 1-hour browser cache, which would serve this hourly-refreshed site's odds stale.
      # It is strict JSON (firebase-tools JSON.parse's it) so the why lives in
      # tasks/lessons/ci-and-deploy.md — read that before touching the headers block.
      - name: Deploy to Firebase Hosting
        id: deploy
        # v0 resolved to this commit on 2026-07-29; keep the action immutable.
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: deuce-forecast
          channelId: live
          firebaseToolsVersion: "15.25.0"

      # Post-deploy verification of the LIVE site — the serving-side analogue of the
      # pre-deploy data-health gate, which only sees local JSON and never Firebase's CDN.
      # Asserts routes / cache headers / MIME / trailingSlash / 404 and, crucially, that the
      # live health.json carries the generatedAt we just built (catches "deploy reported
      # success but the CDN is still serving old content"). continue-on-error: a failure
      # must still flow to "Report deploy health" below, never abort the job before the
      # cache saves. FRESH_TRIES is widened to absorb CDN propagation lag before calling a
      # freshly-shipped deploy stale (the one detail that would otherwise flake every run).
      - name: Verify live Firebase deploy
        id: verifydeploy
        continue-on-error: true
        working-directory: web
        env:
          VERIFY_BASE_URL: ${{ env.SITE_URL }}
          FRESH_TRIES: "18"
        run: |
          set -o pipefail
          EXPECT=$(python -c "import json; print(json.load(open('out/data/health.json'))['generatedAt'])")
          echo "expecting live generatedAt=$EXPECT"
          EXPECT_GENERATED_AT="$EXPECT" node scripts/verify-deploy.mjs 2>&1 | tee /tmp/verify-deploy.log

      # Weekly (Mondays, or whenever the release is missing) snapshot of the raw data
      # to a rolling release asset — upstream disappearance can then never break a
      # bootstrap. Runs after deploy: a snapshot hiccup must not block the site.
      - name: Snapshot raw data to release
        id: snapshot
        if: steps.mode.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view data-archive >/dev/null 2>&1; then
            gh release create data-archive --title "Rolling raw-data archive" \
              --notes "Automated snapshot of raw match data (historical archives are no longer downloadable upstream)." \
              --latest=false
            FORCE=1
          fi
          if [ "$(date -u +%u)" = "1" ] || [ -n "$FORCE" ]; then
            cd tennis_model/data
            DIRS=()
            for d in raw/atp/historical raw/atp/stats raw/wta/historical raw/wta/stats raw/atp/live raw/wta/live raw/charting raw/odds raw/kalshi; do
              [ -d "$d" ] && DIRS+=("$d")
            done
            tar -czf /tmp/raw-archive.tar.gz "${DIRS[@]}"
            gh release upload data-archive /tmp/raw-archive.tar.gz --clobber
            echo "snapshot uploaded ($(du -h /tmp/raw-archive.tar.gz | cut -f1))"
          else
            echo "not Monday - skipping snapshot"
          fi

      # Turn the typed sentinel or blocking gate report into actionable alerts. This step
      # stays after the deploy path (an alert must never cost a valid deploy): reconcile one durable
      # `data-health` GitHub issue per stable structured finding, independently closing
      # only the findings that recovered. Runs on EVERY mode; a standing finding alerts
      # once rather than 24x/day. The branch logic (identity, lifecycle, mode throttling,
      # legacy migration, and the unreachable-API case) lives in
      # .github/scripts/report-data-health.sh so it is directly testable — see
      # tennis_model/tests/test_workflow_alerts.py. Only report-path plumbing stays here.
      # A GITHUB_TOKEN-authenticated issue write can't re-trigger this workflow, so no loop.
      - name: Report data health
        id: reportdata
        if: ${{ always() && (steps.health.outcome == 'success' || steps.gate.outcome == 'failure') }}
        working-directory: tennis_model
        env:
          PYTHONPATH: src
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Read straight from SITE_URL rather than the deploy step's output: this step
          # must still produce a working status link on the paths where the deploy was
          # skipped or failed — which is exactly when the health report matters most.
          HEALTH_PAGE_URL: ${{ env.SITE_URL }}/health/
          # A blocking gate stops before the sentinel write. Its report carries the same
          # typed findings so those incidents still receive independent durable issues.
          HEALTH_REPORT: ${{ steps.gate.outcome == 'failure' && format('{0}/predeploy-gate.json', runner.temp) || 'data/output/health.json' }}
          # A gate report covers output/cross checks only. Its absent keys cannot resolve
          # source or prev-based incidents owned by the full sentinel snapshot.
          FINDING_SNAPSHOT: ${{ steps.gate.outcome == 'failure' && 'partial' || 'authoritative' }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/report-data-health.sh"

      # Turn the post-deploy verification into an actionable alert. The branch logic
      # (dedup, mode throttling, and the skipped-vs-failed distinction) lives in
      # .github/scripts/report-deploy-health.sh so it is directly testable — see
      # tennis_model/tests/test_workflow_alerts.py. if: always() so it runs even when an
      # earlier alert step redded, and so a never-ran verification is seen and no-op'd.
      - name: Report deploy health
        id: reportdeploy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.verifydeploy.outcome }}
          MODE: ${{ steps.mode.outputs.mode }}
          SITE_URL: ${{ env.SITE_URL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report-deploy-health.sh

      # Saved with if: always(), which is the whole point of splitting restore/save.
      # `actions/cache` only saves on a GREEN job, so any downstream failure — an export
      # crash (KeyError: 256 on 2026-07-11, the `.SF` AttributeError on 07-25), a blocked
      # gate, a Firebase hiccup — threw away a ratings walk that had already completed and
      # already written predictor.pkl. The next run then restored the OLD model, so a
      # persistent late-stage bug froze ratings indefinitely. Saving unconditionally keeps
      # the completed walk. Nothing unvalidated escapes by doing so: the pre-deploy gate
      # still decides what SHIPS, and `_predictor_current` re-checks the pickle on load.
      # run_attempt is in the key because "Re-run failed jobs" reuses run_id, and
      # cache/save errors on a key that already exists. The restore step's `restore-keys:
      # tennis-data-` prefix still finds it, so attempt 2 picks up attempt 1's work.
      - name: Save data cache
        id: savecache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: tennis_model/data
          key: tennis-data-${{ github.run_id }}-${{ github.run_attempt }}

      # Escalation for the best-effort persist step above: red the run only AFTER
      # deploy + sentinel have had their chance, so a failing push alerts without
      # ever costing a deploy or a health report.
      - name: Fail if forecast-log push failed
        id: failpersist
        if: steps.mode.outputs.mode == 'full' && steps.persist.outcome == 'failure'
        run: |
          echo "::error::forecast-log push failed after retries (see the Persist forecast log step)"
          exit 1

      # Same escalation shape for the now-non-fatal source download: the retrain got to
      # run on the data we had, the site got to deploy, and only then does the run go red
      # so the incomplete-source failure is still impossible to miss.
      - name: Fail if source downloads were incomplete
        id: faildownload
        if: steps.mode.outputs.mode == 'full' && steps.download.outcome == 'failure'
        run: |
          echo "::error::--strict reported failed source download(s) (see the Download sources step)."
          echo "::error::The retrain still ran on the data already on disk, so ratings are current"
          echo "::error::as of the last successful download — not frozen — but a source is broken."
          exit 1

      # Last-resort ownership for failures that neither the data-health nor deploy-health
      # reporter owns. It runs after the unconditional cache save and the two escalation
      # steps, writes a mode-keyed incident, and exposes `handled` to the terminal job.
      - name: Report pipeline health
        id: reportpipeline
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_CONTEXT: refresh
          MODE: ${{ steps.mode.outputs.mode }}
          PUSH_SCOPE: ${{ steps.scope.outputs.scope }}
          DATA_REPRESENTED: ${{ steps.reportdata.outputs.represented }}
          DEPLOY_REPRESENTED: ${{ steps.reportdeploy.outputs.represented }}
          GATE_REPORT: ${{ runner.temp }}/predeploy-gate.json
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGE_OUTCOMES: |
            checkout=${{ steps.checkout.outcome }}
            scope=${{ steps.scope.outcome }}
            setup_python=${{ steps.setup_python.outcome }}
            install_python=${{ steps.install_python.outcome }}
            restore_data=${{ steps.restore_data.outcome }}
            bootstrap=${{ steps.bootstrap.outcome }}
            mode=${{ steps.mode.outcome }}
            download=${{ steps.download.outcome }}
            retrain=${{ steps.retrain.outcome }}
            quick=${{ steps.quick.outcome }}
            gate=${{ steps.gate.outcome }}
            mirror=${{ steps.mirror.outcome }}
            persist=${{ steps.persist.outcome }}
            health=${{ steps.health.outcome }}
            setup_node=${{ steps.setup_node.outcome }}
            restore_next=${{ steps.restore_next.outcome }}
            build=${{ steps.build.outcome }}
            deploy=${{ steps.deploy.outcome }}
            verifydeploy=${{ steps.verifydeploy.outcome }}
            snapshot=${{ steps.snapshot.outcome }}
            reportdata=${{ steps.reportdata.outcome }}
            reportdeploy=${{ steps.reportdeploy.outcome }}
            savecache=${{ steps.savecache.outcome }}
            failpersist=${{ steps.failpersist.outcome }}
            faildownload=${{ steps.faildownload.outcome }}
        run: bash .github/scripts/report-pipeline-health.sh

  # `refresh` cannot report its own checkout failure, timeout, or missing tail step. This
  # always-running dependent job owns those cases and push-test failures. It uses the exact
  # same mode-keyed reporter, so a successful quick run cannot close a broken full path.
  report-workflow-health:
    needs: [tests, refresh]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout reporter
        uses: actions/checkout@v7

      - name: Report terminal workflow health
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_CONTEXT: workflow
          EVENT_NAME: ${{ github.event_name }}
          TESTS_RESULT: ${{ needs.tests.result }}
          REFRESH_RESULT: ${{ needs.refresh.result }}
          IN_JOB_HANDLED: ${{ needs.refresh.outputs.pipeline_health_handled }}
          IN_JOB_STATE: ${{ needs.refresh.outputs.pipeline_health_state }}
          MODE: ${{ needs.refresh.outputs.selected_mode }}
          PUSH_SCOPE: ${{ needs.refresh.outputs.selected_scope }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/report-pipeline-health.sh
