name: test

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tennis_model/requirements.txt

      - name: Install dependencies
        run: pip install -r tennis_model/requirements.txt

      - name: Lint
        run: pip install ruff && ruff check .

      - name: Run tests
        run: pytest tennis_model/tests -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # `next build` type-checks what the app imports, which excludes tests/ — so type
      # errors could (and did) sit in the test folder indefinitely with CI fully green.
      - name: Type-check (incl. tests/, which the build does not cover)
        run: npx tsc --noEmit

      # catches type errors and export breakage on PRs before the deploy
      # workflow hits them (Next 16 no longer lints during build). No basePath, matching
      # the root-domain Firebase build that refresh.yml ships.
      - name: Prepare deterministic browser fixture
        run: node scripts/prepare-browser-smoke.mjs public/data

      - name: Build (type-check + static export)
        run: npm run build

      # The fetch-only production verifier cannot exercise wheel chaining, overflow geometry,
      # focus, or URL/state interactions. Install the exact Playwright Chromium paired with
      # the lockfile and run only two fixture-backed routes against the built static export;
      # no ESPN/Firebase request is allowed into this pre-merge gate.
      - name: Install browser runtime
        run: npx playwright-core install --with-deps chromium

      - name: Real-browser scroll and interaction smoke
        run: npm run test:browser
